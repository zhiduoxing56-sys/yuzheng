document_status: FORMAL_CANONICAL_CATALOG
version: evidence-type-catalog-v1
canonical_type_count: 38
design_scope: VEHICLE_CONTROL_SAFETY
basis:
  COVESA_VSS: {version: '6.0', local_directory: references/standards/01_covesa_vss_v6.0/vehicle_signal_specification-6.0, machine_readable: [spec/VehicleSignalSpecification.vspec, spec/units.yaml, spec/quantities.yaml]}
  ASAM_OSI: {version: '3.8.0', local_directory: references/standards/02_asam_osi_v3.8.0/open-simulation-interface-3.8.0, machine_readable: ['*.proto', VERSION]}
  ASAM_OPENSCENARIO_XML: {version: '1.4.0', local_directory: references/standards/03_asam_openscenario_xml_v1.4.0, machine_readable: [ASAM_OpenSCENARIO_v1.4.0_Schema/OpenSCENARIO.xsd, 'ASAM_OpenSCENARIO_v1.4.0_Examples/*.xosc']}
  ASAM_OPENDRIVE: {version: '1.9.0', local_directory: references/standards/04_asam_opendrive_v1.9.0, machine_readable: ['ASAM_OpenDRIVE_v1-9-0_xsd_schema_files/*.xsd', 'ASAM_OpenDRIVE_v1-9-0_examples_and_use-cases/**/*.xodr']}
  ANDROID_AUTOMOTIVE_VHAL: {version: 'Android 16 local snapshot', local_directory: references/standards/05_android_automotive_vhal/repo/automotive/vehicle/aidl_property/android/hardware/automotive/vehicle, machine_readable: [VehicleProperty.aidl, '*.aidl']}
mapping_kinds: [DIRECT_STANDARD, DERIVED, INTERNAL_SECURITY]
method_note: >-
  Canonical Evidence 类型是面向车控安全裁决的参数化事实母类，不是标准原始实体的复制。
  标准原生字段、系统派生字段和内部安全字段的逐字段性质见 evidence_runtime_mapping_v1.yaml。

evidence_types:
