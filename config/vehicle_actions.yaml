adapter: simulator
carla:
  host: 127.0.0.1
  port: 2000
  timeout: 10
  autopilot_port: 8000
can:
  enabled: false
  whitelist: []

# 唯一语音执行支持事实。每个 variant 同时冻结 canonical slot 边界与
# 当前 adapter 的物理行为；未列出的 Intent、adapter 或 slot 组合全部拒绝。
canonical_capability_contracts:
  schema_version: 1
  contracts:
    - intent_id: DOOR_OPEN
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots:
            area: {allow_omitted: true, values: [ALL]}
          physical_action: 打开|车门

    - intent_id: DOOR_UNLOCK
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots:
            area: {allow_omitted: true, values: [ALL]}
          physical_action: 解锁|车门

    - intent_id: HEADLIGHT_SET_MODE
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench]
          slots:
            mode: {allow_omitted: false, values: ["OFF"]}
          physical_action: 关闭|前照灯
        - adapters: [carla]
          slots:
            mode: {allow_omitted: false, values: ["OFF"]}
          physical_action: 关闭|前照灯
        - adapters: [carla]
          slots:
            mode: {allow_omitted: false, values: ["ON"]}
          physical_action: 打开|前照灯

    - intent_id: WINDOW_OPEN
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots:
            area: {allow_omitted: true, values: [ALL]}
          physical_action: 打开|车窗

    - intent_id: ACCELERATE
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench]
          slots:
            value: {allow_omitted: true, values: [10]}
          physical_action: 加速|速度
        - adapters: [carla]
          slots:
            value: {allow_omitted: true, values: []}
          physical_action: 加速|速度

    - intent_id: DECELERATE
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench]
          slots:
            value: {allow_omitted: true, values: [10]}
          physical_action: 减速|速度
        - adapters: [carla]
          slots:
            value: {allow_omitted: true, values: []}
          physical_action: 减速|速度

    - intent_id: BRAKE
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench]
          slots:
            value: {allow_omitted: true, values: []}
          physical_action: 打开|制动
        - adapters: [carla]
          slots:
            value: {allow_omitted: true, values: []}
          physical_action: 打开|制动

    - intent_id: AUTO_PARK_ENABLE
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|自动泊车

    - intent_id: SUNROOF_OPEN
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|天窗

    - intent_id: LOW_BEAM_ON
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|近光灯
    - intent_id: LOW_BEAM_OFF
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 关闭|近光灯
    - intent_id: HIGH_BEAM_ON
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|远光灯
    - intent_id: HIGH_BEAM_OFF
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 关闭|远光灯
    - intent_id: FOG_LIGHT_ON
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|雾灯
    - intent_id: FOG_LIGHT_OFF
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 关闭|雾灯
    - intent_id: PARKING_LIGHT_ON
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|驻车灯
    - intent_id: PARKING_LIGHT_OFF
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 关闭|驻车灯
    - intent_id: HAZARD_LIGHT_ON
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|危险警示灯
    - intent_id: HAZARD_LIGHT_OFF
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 关闭|危险警示灯
    - intent_id: TURN_INDICATOR_ON
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 打开|转向灯
    - intent_id: TURN_INDICATOR_OFF
      contract_version: 1
      variants:
        - adapters: [simulator, mock_bench, carla]
          slots: {}
          physical_action: 关闭|转向灯

# 底层物理能力库存，可能包含不向语音执行开放的能力（例如 DISPLAY_OFF）。
# 生产语音资格只由上面的 canonical_capability_contracts 决定。
actions:
  打开|车门:
    operations:
      - {field: door_state, operation: set, value: OPEN}
    feedback: 车门已打开
  解锁|车门:
    operations:
      - {field: door_lock_state, operation: set, value: UNLOCKED}
    feedback: 车门已解锁
  解锁|门锁:
    operations:
      - {field: door_lock_state, operation: set, value: UNLOCKED}
    feedback: 门锁已解锁
  关闭|前照灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 前照灯已关闭
    carla_controls: {light_off: true}
  打开|前照灯:
    carla_controls: {light_on: true}
    feedback: 前照灯已打开
  打开|车窗:
    operations:
      - {field: window_state, operation: set, value: OPEN}
    feedback: 车窗已打开
  关闭|大屏:
    operations:
      - {field: display_state, operation: set, value: "OFF"}
    feedback: 大屏已关闭
  打开|音乐:
    operations:
      - {field: music_state, operation: set, value: PLAYING}
    feedback: 音乐已播放
  播放|音乐:
    operations:
      - {field: music_state, operation: set, value: PLAYING}
    feedback: 音乐已播放
  加速|速度:
    operations:
      - {field: vehicle_speed, operation: increment, value: 10}
    feedback: 模拟车辆已加速
    carla_controls: {throttle: 0.6, duration_s: 1.5}
  减速|速度:
    operations:
      - {field: vehicle_speed, operation: decrement, value: 10, minimum: 0}
    feedback: 模拟车辆已减速
    carla_controls: {brake: 0.5, duration_s: 1.5}
  打开|制动:
    operations:
      - {field: brake_state, operation: set, value: ACTIVE}
      - {field: vehicle_speed, operation: set, value: 0}
    feedback: 模拟制动已执行
    carla_controls: {brake: 0.9, duration_s: 2.0}
  打开|自动泊车:
    operations:
      - {field: vehicle_mode, operation: set, value: AUTO_PARK}
    feedback: 自动泊车已开启
  打开|天窗:
    operations:
      - {field: sunroof_state, operation: set, value: OPEN}
    feedback: 天窗已打开
  打开|空调:
    operations:
      - {field: ac_state, operation: set, value: "ON"}
    feedback: 空调已开启
  打开|近光灯:
    operations:
      - {field: headlight_state, operation: set, value: LOW_BEAM}
    feedback: 近光灯已打开
  关闭|近光灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 近光灯已关闭
  打开|远光灯:
    operations:
      - {field: headlight_state, operation: set, value: HIGH_BEAM}
    feedback: 远光灯已打开
  关闭|远光灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 远光灯已关闭
  打开|雾灯:
    operations:
      - {field: headlight_state, operation: set, value: FOG}
    feedback: 雾灯已打开
  关闭|雾灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 雾灯已关闭
  打开|驻车灯:
    operations:
      - {field: headlight_state, operation: set, value: PARKING}
    feedback: 驻车灯已打开
  关闭|驻车灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 驻车灯已关闭
  打开|危险警示灯:
    operations:
      - {field: headlight_state, operation: set, value: HAZARD}
    feedback: 危险警示灯已打开
  关闭|危险警示灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 危险警示灯已关闭
  打开|转向灯:
    operations:
      - {field: headlight_state, operation: set, value: TURN_INDICATOR}
    feedback: 转向灯已打开
  关闭|转向灯:
    operations:
      - {field: headlight_state, operation: set, value: "OFF"}
    feedback: 转向灯已关闭
