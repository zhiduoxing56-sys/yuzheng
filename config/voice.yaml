voice_trust_mode: enforce

# 音频/麦克风输入保持启用；LA/PA 模型保留但暂不加载或推理。
antispoof_enabled: false

audio:
  target_sample_rate: 16000
  minimum_duration_seconds: 0.35
  maximum_duration_seconds: 15.0
  microphone_channels: 1
  microphone_dtype: float32
  array_channel_zones:
    driver: driver
    front_passenger: front_passenger
    rear_left: rear_left
    rear_right: rear_right
    outside: outside

spectrum:
  silence_rms_threshold: 0.002
  clipping_amplitude_threshold: 0.985
  clipping_ratio_threshold: 0.01
  low_band_hz: 80
  speech_band_low_hz: 80
  speech_band_high_hz: 4000
  high_band_low_hz: 6000
  high_frequency_ratio_threshold: 0.18
  anomaly_weights:
    high_frequency: 0.40
    silence: 0.35
    clipping: 0.25

la:
  task: logical_access_synthetic
  model_name: Sara1708/deepfake-audio-wav2vec2
  revision: 6c43629c953d6ff008501bf5f3eb983ac2321ad6
  source: https://huggingface.co/Sara1708/deepfake-audio-wav2vec2
  version: 6c43629
  weight_file: stage2_best.pt
  label_mapping_source: https://github.com/Saracasm/deepfake-audio-detection/blob/main/src/inference/predict.py
  segment_samples: 64000
  segment_hop_samples: 32000

pa:
  task: physical_access_replay
  model_name: ASVspoof-2021-PA-LFCC-LCNN-official
  source: https://github.com/asvspoof-challenge/2021/tree/main/PA/Baseline-LFCC-LCNN
  version: asvspoof2021-official
  training_dataset: ASVspoof 2019 PA
  weights_path: data/models/asvspoof2021_pa_lfcc_lcnn.pt
  weights_sha256: 1c6d6f30ed1042e584508a9adecc0e514983fff64cdfb3ae3de848064b6e91e0
  label_mapping:
    training_label_0: spoof
    training_label_1: bonafide
    positive_scalar_logit: bonafide
    negative_scalar_logit: replay
  label_mapping_source: https://github.com/asvspoof-challenge/2021/blob/main/PA/Baseline-LFCC-LCNN/project/README
  score_semantics:
    pa_raw_score: official_uncalibrated_bonafide_direction_scalar
    pa_score: sigmoid_normalized_engineering_trust_score
    replay_risk: one_minus_pa_score
  license: BSD-3-Clause
  copyright: Copyright (c) 2020, Xin Wang, National Institute of Informatics
  input_sample_rate: 16000
  lfcc:
    pre_emphasis: 0.97
    n_fft: 1024
    hop_length: 160
    win_length: 320
    window: hamming
    frequency_bins: 256
    linear_filterbank_bins: 20
    lfcc_coefficients: 20
    delta_order: 2

asr:
  adapter: sensevoice
  model_name: FunAudioLLM/SenseVoiceSmall
  revision: 3847d57b6bdf2dd8875cb1508d2af43d80a16bf7
  source: https://huggingface.co/FunAudioLLM/SenseVoiceSmall
  version: 3847d57
  # SentencePiece 在 Windows 上不能可靠读取含中文的模型目录，因此使用纯英文用户缓存路径。
  model_path: "%LOCALAPPDATA%/yuzheng/models/sensevoice-small"
  language: zh
  use_itn: true
  device: cpu
  ncpu: 4
  batch_size_seconds: 15

trust:
  weights:
    synthetic_risk: 0.40
    replay_risk: 0.40
    zone_risk: 0.20
  thresholds:
    PASS: 0.90
    REVIEW: 0.45
    BLOCK: 0.0
  zone_risk:
    driver: 0.0
    front_passenger: 0.45
    rear_left: 0.60
    rear_right: 0.60
    outside: 1.0
    unknown: 0.75

zone_permission:
  # 由迁移前 target 风险集合机械展开；运行时只按统一 Registry 的 intent_id 命中。
  critical_intent_ids:
    - STEERING_WHEEL_SET_EXTENSION
    - STEERING_WHEEL_SET_TILT
    - CRUISE_ENABLE
    - CRUISE_DISABLE
    - CRUISE_SET_SPEED
    - CRUISE_SET_GAP
    - HEADLIGHT_SET_MODE
    - WINDOW_OPEN
    - WINDOW_CLOSE
    - WINDOW_SET_POSITION
    - DOOR_OPEN
    - DOOR_CLOSE
    - DOOR_SET_POSITION
    - DOOR_LOCK
    - DOOR_UNLOCK
    - WIPER_SET_MODE
    - WIPER_SET_SENSITIVITY
    - ACCELERATE
    - DECELERATE
    - EVASIVE_STEER
    - BRAKE
    - EMERGENCY_BRAKE
    - AUTO_PARK_ENABLE
  zone_weight:
    driver: 0.0
    front_passenger: 0.65
    rear_left: 0.80
    rear_right: 0.80
    outside: 1.0
    unknown: 0.75
  # 由迁移前 action 权重机械展开；未列出的 Formal Intent 使用原 unknown=0.20。
  default_intent_weight: 0.20
  intent_weight:
    MIRROR_HEATING_ON: 0.40
    MIRROR_HEATING_OFF: 0.35
    DEFROST_ON: 0.40
    DEFROST_OFF: 0.35
    WINDSHIELD_HEATING_ON: 0.40
    WINDSHIELD_HEATING_OFF: 0.35
    ESC_ENABLE: 0.40
    TRUNK_OPEN: 0.40
    TRUNK_CLOSE: 0.35
    TRUNK_LOCK: 0.45
    TRUNK_UNLOCK: 0.80
    HOOD_OPEN: 0.40
    HOOD_CLOSE: 0.35
    SUNROOF_OPEN: 0.40
    SUNROOF_CLOSE: 0.35
    CRUISE_ENABLE: 0.40
    HEADLIGHT_SET_MODE: 0.20
    HAZARD_LIGHT_ON: 0.40
    HAZARD_LIGHT_OFF: 0.35
    TURN_INDICATOR_ON: 0.40
    TURN_INDICATOR_OFF: 0.35
    LOW_BEAM_ON: 0.40
    LOW_BEAM_OFF: 0.35
    HIGH_BEAM_ON: 0.40
    HIGH_BEAM_OFF: 0.35
    FOG_LIGHT_ON: 0.40
    FOG_LIGHT_OFF: 0.35
    PARKING_LIGHT_ON: 0.40
    PARKING_LIGHT_OFF: 0.35
    WINDOW_OPEN: 0.40
    WINDOW_CLOSE: 0.35
    DOOR_OPEN: 0.40
    DOOR_CLOSE: 0.35
    DOOR_LOCK: 0.45
    DOOR_UNLOCK: 0.80
    PARKING_BRAKE_AUTO_APPLY_ENABLE: 0.40
    ACCELERATE: 1.0
    DECELERATE: 0.80
    BRAKE: 0.40
    EMERGENCY_BRAKE: 0.20
    AUTO_PARK_ENABLE: 0.40
  thresholds:
    PASS: 0.60
    REVIEW: 0.35
    BLOCK: 0.0
