audio:
  target_sample_rate: 16000
  minimum_duration_seconds: 0.35
  maximum_duration_seconds: 15.0
  microphone_channels: 1
  microphone_dtype: float32
  array_channel_zones:
    driver: driver
    front_passenger: front_passenger
    rear_left: rear_left
    rear_right: rear_right
    outside: outside

spectrum:
  silence_rms_threshold: 0.002
  clipping_amplitude_threshold: 0.985
  clipping_ratio_threshold: 0.01
  low_band_hz: 80
  speech_band_low_hz: 80
  speech_band_high_hz: 4000
  high_band_low_hz: 6000
  high_frequency_ratio_threshold: 0.18
  anomaly_weights:
    high_frequency: 0.40
    silence: 0.35
    clipping: 0.25

la:
  task: logical_access_synthetic
  model_name: Sara1708/deepfake-audio-wav2vec2
  revision: 6c43629c953d6ff008501bf5f3eb983ac2321ad6
  source: https://huggingface.co/Sara1708/deepfake-audio-wav2vec2
  version: 6c43629
  weight_file: stage2_best.pt
  label_mapping_source: https://github.com/Saracasm/deepfake-audio-detection/blob/main/src/inference/predict.py
  segment_samples: 64000
  segment_hop_samples: 32000

pa:
  task: physical_access_replay
  model_name: ASVspoof-2021-PA-LFCC-LCNN-official
  source: https://github.com/asvspoof-challenge/2021/tree/main/PA/Baseline-LFCC-LCNN
  version: asvspoof2021-official
  training_dataset: ASVspoof 2019 PA
  weights_path: data/models/asvspoof2021_pa_lfcc_lcnn.pt
  weights_sha256: 1c6d6f30ed1042e584508a9adecc0e514983fff64cdfb3ae3de848064b6e91e0
  label_mapping:
    training_label_0: spoof
    training_label_1: bonafide
    positive_scalar_logit: bonafide
    negative_scalar_logit: replay
  label_mapping_source: https://github.com/asvspoof-challenge/2021/blob/main/PA/Baseline-LFCC-LCNN/project/README
  score_semantics:
    pa_raw_score: official_uncalibrated_bonafide_direction_scalar
    pa_score: sigmoid_normalized_engineering_trust_score
    replay_risk: one_minus_pa_score
  license: BSD-3-Clause
  copyright: Copyright (c) 2020, Xin Wang, National Institute of Informatics
  input_sample_rate: 16000
  lfcc:
    pre_emphasis: 0.97
    n_fft: 1024
    hop_length: 160
    win_length: 320
    window: hamming
    frequency_bins: 256
    linear_filterbank_bins: 20
    lfcc_coefficients: 20
    delta_order: 2

asr:
  model_name: openai/whisper-base
  revision: e37978b90ca9030d5170a5c07aadb050351a65bb
  source: https://huggingface.co/openai/whisper-base
  version: e37978b
  language: zh
  task: transcribe
  maximum_new_tokens: 64

trust:
  weights:
    synthetic_risk: 0.40
    replay_risk: 0.40
    zone_risk: 0.20
  thresholds:
    PASS: 0.90
    REVIEW: 0.45
    BLOCK: 0.0
  zone_risk:
    driver: 0.0
    front_passenger: 0.45
    rear_left: 0.60
    rear_right: 0.60
    outside: 1.0
    unknown: 0.75

zone_permission:
  critical_targets:
    - 方向盘
    - 油门
    - 制动
    - 前照灯
    - 所有灯光
    - 雨刮
    - 车窗
    - 门锁
    - 车门
    - 速度
    - 驾驶模式
    - 自动泊车
    - 巡航
  zone_weight:
    driver: 0.0
    front_passenger: 0.65
    rear_left: 0.80
    rear_right: 0.80
    outside: 1.0
    unknown: 0.75
  action_weight:
    打开: 0.40
    关闭: 0.35
    调高: 0.30
    调低: 0.30
    加速: 1.0
    减速: 0.80
    锁定: 0.45
    解锁: 0.80
    切换: 0.40
    查询: 0.0
    确认: 0.10
    取消: 0.0
    unknown: 0.20
  thresholds:
    PASS: 0.60
    REVIEW: 0.35
    BLOCK: 0.0
