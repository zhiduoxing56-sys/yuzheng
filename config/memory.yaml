configuration_version: MEMORY_ALGORITHM_2_V1
topology_version: SENSOR_TOPOLOGY_V1
temporal_sync_window_ms: 30000
temporal_sync_window_source: EXISTING_FORMAL_CONFIG
average_degree_limit: 16
average_degree_limit_source: REPORT_EXPLICIT
propagation_alpha: 0.30
propagation_alpha_source: REPORT_EXPLICIT
propagation_direction: G3_TO_G2_TO_G1_TO_G0
unknown_type_policy: KEEP_UNCLASSIFIED_WITH_WARNING

relation_priority:
  SENSOR_TOPOLOGY: 4
  SEMANTIC_COMPLEMENT: 3
  SPATIAL_COOCCURRENCE: 2
  TEMPORAL_SYNCHRONIZATION: 1

semantic_complement_rules:
  - {from_type: side_rear_mmwave_radar, to_type: side_camera, relation: ACTION_EVIDENCE_DEPENDENCY, source: ACTION_EVIDENCE_DEPENDENCY}
  - {from_type: front_mmwave_radar, to_type: front_lidar, relation: ACTION_EVIDENCE_DEPENDENCY, source: ACTION_EVIDENCE_DEPENDENCY}
  - {from_type: front_radar, to_type: front_camera, relation: ACTION_EVIDENCE_DEPENDENCY, source: ACTION_EVIDENCE_DEPENDENCY}
  - {from_type: front_camera, to_type: lane_marking_map, relation: ACTION_EVIDENCE_DEPENDENCY, source: ACTION_EVIDENCE_DEPENDENCY}
  - {from_type: surround_view_camera, to_type: ultrasonic_radar, relation: ACTION_EVIDENCE_DEPENDENCY, source: ACTION_EVIDENCE_DEPENDENCY}
  - {from_type: vehicle_speed, to_type: gear_position, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: door_state, to_type: door_lock_state, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: ambient_light, to_type: headlight_state, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: navigation_active, to_type: display_state, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: occupant_role, to_type: authentication_state, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}

sensor_topology:
  - {from_type: side_rear_mmwave_radar, to_type: side_camera, relation: SIDE_ENVIRONMENT_CROSS_SENSOR, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: front_mmwave_radar, to_type: front_lidar, relation: FRONT_ENVIRONMENT_CROSS_SENSOR, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: front_radar, to_type: front_camera, relation: FRONT_ENVIRONMENT_CROSS_SENSOR, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: surround_view_camera, to_type: ultrasonic_radar, relation: PARKING_CROSS_SENSOR, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: vehicle_speed, to_type: gear_position, relation: VEHICLE_DYNAMICS_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: vehicle_speed, to_type: brake_state, relation: VEHICLE_DYNAMICS_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: vehicle_speed, to_type: vehicle_mode, relation: VEHICLE_DYNAMICS_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: door_state, to_type: door_lock_state, relation: DOOR_ACTUATOR_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: ambient_light, to_type: headlight_state, relation: LIGHTING_SENSOR_ACTUATOR, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: occupant_role, to_type: speaker_zone, relation: CABIN_IDENTITY_ZONE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: occupant_role, to_type: authentication_state, relation: CABIN_IDENTITY_AUTH, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}

layers:
  L3_EMERGENCY: 3
  L2_DRIVING: 2
  L1_CABIN: 1
  L0_ENTERTAINMENT: 0

horizontal:
  time_window_seconds: 30
  factors:
    same_time_window: 0.20
    same_area: 0.10
    same_source: 0.15
    semantic_complement: 0.15
    functional_dependency: 0.15
    common_action_support: 0.15
    common_target_constraint: 0.10
  support_coefficient: 0.08
  conflict_penalty: 0.25
  functional_pairs:
    - [vehicle_speed, gear_position]
    - [door_state, door_lock_state]
    - [ambient_light, headlight_state]
    - [navigation_active, display_state]
    - [reverse_camera_active, display_state]
    - [occupant_role, authentication_state]

vertical:
  alpha: 0.30
  risk_penalty: 0.30
  support_bonus: 0.05
  support_formula: "support_adjustment = alpha * support_bonus * source_weight"
  risk_formula: "risk_adjustment = -alpha * risk_penalty * source_risk"
  final_formula: "after = clamp(before + support_adjustment + risk_adjustment, 0, 1)"
  direction: "higher_safety_layer_to_lower_safety_layer_only"
  allowed_support_paths:
    - [safety_rule, display_state]
    - [vehicle_mode, display_state]
    - [vehicle_speed, door_lock_state]
    - [authentication_state, door_lock_state]
