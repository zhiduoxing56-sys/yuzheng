configuration_version: MEMORY_ALGORITHM_2_V1
topology_version: SENSOR_TOPOLOGY_V1
temporal_sync_window_ms: 30000
temporal_sync_window_source: EXISTING_FORMAL_CONFIG
average_degree_limit: 16
average_degree_limit_source: REPORT_EXPLICIT
propagation_alpha: 0.30
propagation_alpha_source: REPORT_EXPLICIT
propagation_direction: G3_TO_G2_TO_G1_TO_G0
unknown_type_policy: KEEP_UNCLASSIFIED_WITH_WARNING

relation_priority:
  SENSOR_TOPOLOGY: 4
  SEMANTIC_COMPLEMENT: 3
  SPATIAL_COOCCURRENCE: 2
  TEMPORAL_SYNCHRONIZATION: 1

semantic_complement_rules:
  - {from_type: SURROUNDING_OBJECT_STATE, to_type: LANE_STATE, relation: ACTION_EVIDENCE_DEPENDENCY, source: ACTION_EVIDENCE_DEPENDENCY}
  - {from_type: VEHICLE_SPEED, to_type: GEAR_STATE, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: VEHICLE_SPEED, to_type: SERVICE_BRAKE_STATE, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: DOOR_STATE, to_type: DOOR_LOCK_STATE, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: ENVIRONMENT_CONDITIONS, to_type: LIGHTING_STATE, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}
  - {from_type: OCCUPANT_STATE, to_type: AUTHORIZATION_STATE, relation: EXISTING_GRAPH_RULE, source: EXISTING_GRAPH_RULE}

sensor_topology:
  - {from_type: SURROUNDING_OBJECT_STATE, to_type: LANE_STATE, relation: ENVIRONMENT_PERCEPTION_TOPOLOGY, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: FREE_SPACE_STATE, to_type: SURROUNDING_OBJECT_STATE, relation: PARKING_ENVIRONMENT_TOPOLOGY, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: VEHICLE_SPEED, to_type: GEAR_STATE, relation: VEHICLE_DYNAMICS_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: VEHICLE_SPEED, to_type: SERVICE_BRAKE_STATE, relation: VEHICLE_DYNAMICS_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: VEHICLE_SPEED, to_type: SYSTEM_MODE, relation: VEHICLE_DYNAMICS_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: DOOR_STATE, to_type: DOOR_LOCK_STATE, relation: DOOR_ACTUATOR_STATE, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: ENVIRONMENT_CONDITIONS, to_type: LIGHTING_STATE, relation: LIGHTING_SENSOR_ACTUATOR, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}
  - {from_type: OCCUPANT_STATE, to_type: AUTHORIZATION_STATE, relation: CABIN_IDENTITY_AUTH, direction: BIDIRECTIONAL, source: ENGINEERING_CONFIG}

layers:
  L3_EMERGENCY: 3
  L2_DRIVING: 2
  L1_CABIN: 1
  L0_ENTERTAINMENT: 0

horizontal:
  time_window_seconds: 30
  factors:
    same_time_window: 0.20
    same_area: 0.10
    same_source: 0.15
    semantic_complement: 0.15
    functional_dependency: 0.15
    common_action_support: 0.15
    common_target_constraint: 0.10
  support_coefficient: 0.08
  conflict_penalty: 0.25
  functional_pairs:
    - [VEHICLE_SPEED, GEAR_STATE]
    - [VEHICLE_SPEED, SERVICE_BRAKE_STATE]
    - [DOOR_STATE, DOOR_LOCK_STATE]
    - [ENVIRONMENT_CONDITIONS, LIGHTING_STATE]
    - [FREE_SPACE_STATE, SYSTEM_MODE]
    - [OCCUPANT_STATE, AUTHORIZATION_STATE]

vertical:
  alpha: 0.30
  risk_penalty: 0.30
  support_bonus: 0.05
  support_formula: "support_adjustment = alpha * support_bonus * source_weight"
  risk_formula: "risk_adjustment = -alpha * risk_penalty * source_risk"
  final_formula: "after = clamp(before + support_adjustment + risk_adjustment, 0, 1)"
  direction: "higher_safety_layer_to_lower_safety_layer_only"
  allowed_support_paths:
    - [SYSTEM_MODE, LIGHTING_STATE]
    - [VEHICLE_SPEED, DOOR_LOCK_STATE]
    - [AUTHORIZATION_STATE, DOOR_LOCK_STATE]
