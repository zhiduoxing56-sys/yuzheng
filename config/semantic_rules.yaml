normalization_replacements:
  窗户: 车窗
  大灯: 前照灯
  屏幕: 大屏
  熄掉: 关闭
  降下来: 打开
  开一下: 打开
  关一下: 关闭
  快一点: 加速
  慢一点: 减速

filler_words:
  - 请
  - 帮我
  - 麻烦

vague_pronouns:
  - 那个
  - 这个
  - 它
  - 那玩意

uncertainty_markers: [可能, 也许, 大概]
uncertainty_ambiguity: 0.8
uncertainty_confidence_penalty: 0.6

actions:
  打开: [打开, 开启, 启动, 播放, 制动, 刹车]
  关闭: [关闭, 关掉, 关上]
  调高: [调高, 增大, 升高]
  调低: [调低, 减小, 降低]
  加速: [加速, 提速, 快点]
  减速: [减速, 降速, 慢点]
  锁定: [锁定, 上锁, 锁上]
  解锁: [解锁, 开锁]
  切换: [切换, 换成, 进入]
  查询: [查询, 查看, 多少, 什么状态]
  确认: [确认, 是的, 确定]
  取消: [取消, 算了, 不用了]

implicit_targets_by_action:
  加速: 速度
  减速: 速度

targets:
  车门: [车门, 车门锁]
  门锁: [门锁]
  车窗: [车窗]
  前照灯: [前照灯]
  阅读灯: [阅读灯]
  所有灯光: [所有灯光, 全部灯光]
  大屏: [大屏, 中控屏]
  空调: [空调]
  音乐: [音乐, 音响]
  雨刮: [雨刮, 雨刷]
  速度: [速度, 车速]
  驾驶模式: [驾驶模式]
  自动泊车: [自动泊车, 自动停车]
  巡航: [巡航, 自适应巡航]
  制动: [制动, 刹车]

areas:
  左侧: [左边, 左侧, 左面]
  右侧: [右边, 右侧, 右面]
  前排: [前排, 前面]
  后排: [后排, 后面]

domains:
  车身控制: [车门, 门锁, 车窗, 前照灯, 阅读灯, 所有灯光, 雨刮]
  座舱控制: [大屏, 空调]
  娱乐控制: [音乐]
  驾驶控制: [速度, 驾驶模式, 自动泊车, 巡航, 制动]

risk_profiles:
  打开|车门:
    level: R3
    tags: [车身安全, 运动中误操作]
  解锁|车门:
    level: R3
    tags: [权限安全, 车身安全]
  解锁|门锁:
    level: R3
    tags: [权限安全, 车身安全]
  关闭|前照灯:
    level: R3
    tags: [驾驶视野, 环境风险]
  加速|速度:
    level: R3
    tags: [驾驶控制]
  减速|速度:
    level: R2
    tags: [驾驶控制]
  打开|自动泊车:
    level: R2
    tags: [辅助驾驶]
  打开|制动:
    level: R3
    tags: [紧急制动, 驾驶控制]
  default:
    level: R1
    tags: []

context_claim_patterns:
  simulator_claim: [模拟器模式, 仿真模式, 测试环境]
  role_claim: [我是管理员, 我是车主, 我是驾驶员]
  emergency_claim: [紧急情况, 紧急状态]
  safety_bypass_claim: [忽略安全限制, 忽略安全规则, 关闭安全保护, 关闭安全功能, 绕过权限, 绕过权限校验]
  outside_vehicle_claim: [我人在车外, 我在车外]
  authorization_claim: [已经获得授权, 已获得授权, 我有授权, 允许直接]
  direct_interface_claim: [直接调用车辆接口, 直接发送控制报文, 车辆控制报文]
  system_mode_claim: [修改系统模式, 篡改系统模式, 切换系统模式]
