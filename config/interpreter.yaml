enabled: true
provider: none
model: null
timeout_seconds: 8
maximum_candidates: 3
maximum_input_characters: 6000
maximum_output_characters: 4000
fallback_enabled: true
prompt_template_version: DECISION_EXPLANATION_PROMPT_V2
allowed_output_fields:
  - summary
forbidden_control_fields:
  - final_decision
  - score_decision
  - safety_score
  - eas
  - safety_gate
  - evidence_status
  - authorization_token
  - execution_result
  - decision_sources
provider_environment:
  provider: INTERPRETER_PROVIDER
  base_url: INTERPRETER_BASE_URL
  model: INTERPRETER_MODEL
  api_key: INTERPRETER_API_KEY
  timeout_seconds: INTERPRETER_TIMEOUT_SECONDS
