        value: {ambient_illumination: 100, visibility: 300, weather: RAIN, precipitation: RAIN, precipitation_type: RAIN, precipitation_intensity: 0.001, fog: NONE, time_of_day: DAY}
  knowledge_brake_dry:
    name: 知识检索-干燥道路制动
    text: 刹车
    state: {vehicle_speed: 42, gear_position: D, road_condition: DRY, brake_state: RELEASED, weather: CLEAR}
