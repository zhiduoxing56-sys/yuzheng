      - {evidence_type: ENVIRONMENT_CONDITIONS, source: SIMULATION, value: {ambient_illumination: 100, weather: CLEAR, precipitation: NONE, fog: NONE, time_of_day: DAY}}
      - evidence_type: ROAD_FRICTION_STATE
        source: SIMULATION
        value: {road_condition: DRY, wetness: DRY, friction_scale_factor: 0.9, lower_bound: 0.8, most_probable: 0.9, upper_bound: 1.0}
  knowledge_brake_wet:
