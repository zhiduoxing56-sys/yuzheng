      - {evidence_type: SYSTEM_MODE, source: SIMULATION, value: {vehicle_mode: REAL_DRIVING, safety_constraint: ENABLED, simulation: true}}
      - {evidence_type: ROAD_FRICTION_STATE, source: SIMULATION, value: {road_condition: DRY, wetness: DRY}}
      - {evidence_type: ENVIRONMENT_CONDITIONS, source: SIMULATION, value: {ambient_illumination: 100, weather: CLEAR, precipitation: NONE, fog: NONE, time_of_day: DAY}}
      - evidence_type: SURROUNDING_OBJECT_STATE
        source: SIMULATION
        value: {objects: [], collision_state: NONE}
  knowledge_door_right_rear_bicycle_risk:
    name: 知识检索-右后自行车接近开门风险
    text: 打开右后车门
    state: {vehicle_speed: 42, gear_position: D, weather: CLEAR}
    evidence_overrides:
      - {evidence_type: VEHICLE_SPEED, source: SIMULATION, value: 42}
      - {evidence_type: GEAR_STATE, source: SIMULATION, value: {current_gear: D}}
      - {evidence_type: SYSTEM_MODE, source: SIMULATION, value: {vehicle_mode: REAL_DRIVING, safety_constraint: ENABLED, simulation: true}}
      - {evidence_type: ROAD_FRICTION_STATE, source: SIMULATION, value: {road_condition: DRY, wetness: DRY}}
      - {evidence_type: ENVIRONMENT_CONDITIONS, source: SIMULATION, value: {ambient_illumination: 100, weather: CLEAR, precipitation: NONE, fog: NONE, time_of_day: DAY}}
      - evidence_type: SURROUNDING_OBJECT_STATE
        source: SIMULATION
        value:
          objects:
            - {object_id: bicycle-right-rear, entity_kind: BICYCLE, region: REAR_RIGHT, exists: true, distance: 3.0, relative_speed: -5.0, motion_state: APPROACHING, risk_level: HIGH, source_kind: SIMULATION, ground_truth: true}
          collision_state: NONE
  knowledge_wiper_clear:
    name: 知识检索-晴天开启雨刮自动模式
    text: 开启雨刮自动模式
    state: {vehicle_speed: 42, gear_position: D, weather: CLEAR, ambient_light: 100}
