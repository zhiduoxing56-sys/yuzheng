M: 16
ef_construction: 200
ef_search: 30
top_k: 20

security_layering:
  enabled: true
  layering_mode: CUMULATIVE_REAL_HNSWLIB_INDICES
  implementation_source: ENGINEERING_REALIZATION
  max_layer: 3
  max_layer_source: ENGINEERING_CONFIG
  formula_version: PDF_2_8_V1
  formula_source: REPORT_EXPLICIT
  index_seed: yuzheng-hnsw-step2-seed-v1
  index_seed_source: ENGINEERING_CONFIG
  hnswlib_random_seed: 100
  hnswlib_random_seed_source: ENGINEERING_CONFIG
  random_level_distribution: PDF_GEOMETRIC_EXPONENTIAL
  random_level_sampler: DETERMINISTIC_SHA256_INVERSE_CDF
  random_level_source: ENGINEERING_REALIZATION
  security_mapping_version: SECURITY_CLASS_V1
  security_rank_mapping_source: EXISTING_PROJECT_MAPPING
  unknown_type_strategy: UNCLASSIFIED_BASE_ONLY
  internal_trace_reason: UNSUPPORTED_BY_PUBLIC_HNSWLIB_API
  websocket_candidates_per_layer: 5
  audit_candidates_per_layer: 30

  security_classes:
    ENTERTAINMENT:
      rank: 0
      report_label: Entertainment
      legacy_names: [L0_ENTERTAINMENT]
    COCKPIT:
      rank: 1
      report_label: Cockpit
      legacy_names: [L1_CABIN, CABIN]
    DRIVING:
      rank: 2
      report_label: Driving
      legacy_names: [L2_DRIVING]
    EMERGENCY:
      rank: 3
      report_label: Emergency
      legacy_names: [L3_EMERGENCY]

