alignment_weights:
  ecr: 0.35
  ecs: 0.25
  ef: 0.20
  sas: 0.20

# The report specifies qualitative dynamic emphasis but no numeric weights.
# These profiles are therefore explicit engineering configuration.
alignment_profiles:
  default:
    ecr: 0.35
    ecs: 0.25
    ef: 0.20
    sas: 0.20
  high_speed:
    ecr: 0.30
    ecs: 0.20
    ef: 0.30
    sas: 0.20
  complex_road:
    ecr: 0.30
    ecs: 0.35
    ef: 0.15
    sas: 0.20
profile_selection:
  high_speed_threshold_kmh: 80
  complex_road_values: [COMPLEX, COMPLEX_ROAD, INTERSECTION, COMPLEX_INTERSECTION, CROSSROADS, 复杂道路, 复杂路口, 交叉路口]

freshness:
  default:
    decay_coefficient: 0.02
    validity_seconds: 30
  VEHICLE_SPEED:
    decay_coefficient: 0.35
    validity_seconds: 3
  GEAR_STATE:
    decay_coefficient: 0.12
    validity_seconds: 10
  DOOR_LOCK_STATE:
    decay_coefficient: 0.08
    validity_seconds: 15
  OCCUPANT_STATE:
    decay_coefficient: 0.02
    validity_seconds: 60
  SYSTEM_MODE:
    decay_coefficient: 0.03
    validity_seconds: 60

conflicts:
  vehicle_speed_delta: 8.0
  moving_speed_threshold: 5.0

window:
  short_length: 8
