    same_text_span_policy: DISALLOW_SHARED_SPAN
  VALUE_XOR_MODE:
    rule: XOR
    slots:
    - VALUE
    - MODE
    jointly_present_exception: ALLOW_ONLY_IF_DETERMINISTICALLY_CONSISTENT
  TORQUE_DIRECTION_FOR_NONZERO_VALUE:
    rule: DIRECTION_REQUIRED_IF_VALUE_NONZERO
    value_slot: VALUE
    direction_slot: DIRECTION
    zero_value_semantics: BALANCED_50_50
    direction_for_zero_prohibited: true
mode_mapping_contracts:
  GEAR_VEHICLE_SPECIFIC:
    canonical_modes:
    - P
    - N
    - D
    - R
    - FORWARD_GEAR_N
    - REVERSE_GEAR_N
    lexical_aliases:
      R挡: R
      倒挡: R
      挂倒挡: R
      倒N挡: REVERSE_GEAR_N
    vss_code_rules:
      P: 126
      N: 0
      D: 127
      R: VEHICLE_CAPABILITY_MAPPING_REQUIRED
      FORWARD_GEAR_N: POSITIVE_INTEGER_N
      REVERSE_GEAR_N: NEGATIVE_INTEGER_N
    physical_mapping_authority: VehicleCapabilityMapping
    vehicle_specific_validation_required: true
    prohibited_generic_mapping: R -> -1 or REVERSE_GEAR_1
  HEADLIGHT_MAIN_SWITCH:
    canonical_modes: *id001
    lexical_aliases:
      'ON':
        canonical_mode: 'ON'
        condition: EXPLICIT_MAIN_LIGHT_SWITCH_REFERENCE
    restricted_aliases:
      'ON':
        allowed_intent_id: HEADLIGHT_SET_MODE
        prohibited_intent_ids:
        - LOW_BEAM_ON
        - HIGH_BEAM_ON
        prohibited_canonical_mode: BEAM
value_mapping_contracts:
  TORQUE_DISTRIBUTION_SIGNED_PERCENT:
    source_path: Vehicle.Powertrain.Transmission.TorqueDistribution
    vehicle_native_domain:
      type: SIGNED_PERCENT
      canonical_unit: '%'
      min: -100
      max: 100
      zero_semantics: BALANCED_50_50
      negative_semantics: FRONT_BIAS
      positive_semantics: REAR_BIAS
    user_canonical_domain:
      value_contract: PERCENT_0_100_REQUIRED
      direction_contract: TORQUE_DISTRIBUTION_FRONT_REAR
      value_is_nonnegative_magnitude: true
      zero_value_semantics: BALANCED_50_50
      direction_required_when_value_nonzero: true
      direction_prohibited_when_value_zero: true
    future_parameter_normalizer_mapping:
      FRONT: NEGATIVE_SIGN
      REAR: POSITIVE_SIGN
      BALANCED_50_50: ZERO
    runtime_mapping_implemented: false
