    canonical_modes:
    - 'OFF'
    - POSITION
    - DAYTIME_RUNNING_LIGHTS
    - AUTO
    - BEAM
    lexical_aliases:
      'ON':
        canonical_mode: BEAM
        condition: EXPLICIT_MAIN_LIGHT_SWITCH_REFERENCE
