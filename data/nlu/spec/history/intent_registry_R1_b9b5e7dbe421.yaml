    canonical_modes:
    - P
    - N
    - D
    - R
    - FORWARD_GEAR_N
    - REVERSE_GEAR_N
    lexical_aliases:
      R挡: R
      倒挡: R
      挂倒挡: R
      倒N挡: REVERSE_GEAR_N
    vss_code_rules:
      P: 126
      N: 0
      D: 127
      R: VEHICLE_CAPABILITY_MAPPING_REQUIRED
      FORWARD_GEAR_N: POSITIVE_INTEGER_N
      REVERSE_GEAR_N: NEGATIVE_INTEGER_N
    physical_mapping_authority: VehicleCapabilityMapping
    vehicle_specific_validation_required: true
    prohibited_generic_mapping: R -> -1 or REVERSE_GEAR_1
