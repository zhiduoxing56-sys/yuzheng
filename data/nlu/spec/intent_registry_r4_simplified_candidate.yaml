area_semantics:
  area_types:
    ATOMIC:
      description_zh: 对应当前能力中的一个具体车辆执行器实例。
      executor_cardinality: ONE
    COMPOSITE:
      description_zh: 对应多个原子区域的显式聚合操作，具体 fan-out 由未来 Resolver 按已批准能力合同处理。
      executor_cardinality: MULTIPLE_CAPABILITY_SPECIFIC
      explicit_user_expression_required: true
  missing_area:
    representation: UNRESOLVED
    description_zh: 用户未明确区域且存在多个合法物理目标时，Intent 仍可识别，但 AREA 保持未解析，参数不可视为完整可执行。
    parameter_resolution_status: INCOMPLETE_MISSING_AREA
    implicit_defaults_prohibited:
    - ALL
    - DRIVER_POSITION
    - SPEAKER_POSITION
    - NEAREST_POSITION
    - CONTEXT_INFERENCE
    future_behavior: REVIEW_OR_PARAMETER_COMPLETION
    approved_vehicle_default_policy_exception: EXPLICIT_HUMAN_APPROVAL_REQUIRED
  composite_area_policy:
    explicit_expression_required: true
    runtime_fan_out_implemented: false
    capability_specific_approval_required: true
value_language_semantics:
  responsibility_boundary:
    registry_describes:
    - VEHICLE_NATIVE_NUMERIC_DOMAIN
    - ALLOWED_NATURAL_LANGUAGE_SEMANTIC_FORMS
    - PARAMETER_RESOLUTION_COMPLETENESS
    semantic_understanding_is_not_vehicle_execution_value: true
    nlu_physical_step_guessing_prohibited: true
    runtime_parameter_normalizer_implemented: false
  parameter_resolution_statuses:
    COMPLETE_AFTER_DETERMINISTIC_NORMALIZATION:
      description_zh: 语义形式、数值与单位足够，经过确定性单位和范围归一后可形成参数。
    INCOMPLETE_NEEDS_VEHICLE_PARAMETERIZATION:
      description_zh: 用户语义已理解，但必须由未来车型参数规范化层确定物理步长。
    INCOMPLETE_NEEDS_CLARIFICATION:
      description_zh: 用户表达了部分调节，但没有提供足够的目标程度，需要复核或澄清。
    INCOMPLETE_MISSING_MAGNITUDE:
      description_zh: 仅识别出调节方向，没有识别出幅度，不能生成默认步长。
    INCOMPLETE_MISSING_AREA:
      description_zh: 多实例对象未解析出区域，不能选择具体执行器。
  forms:
    ABSOLUTE_TARGET:
      description_zh: 用户给出绝对目标值；百分比能力中的“一半”可确定性规范为 50%。
      examples:
      - 开到30%
      - 调到80公里每小时
      - 一半
      resolution_status: COMPLETE_AFTER_DETERMINISTIC_NORMALIZATION
    EXPLICIT_RELATIVE_DELTA:
      description_zh: 用户给出明确相对变化方向和明确数值，二者必须同时保留，不折叠为绝对目标。
      examples:
      - 再开10%
      - 再提高5毫米
      resolution_status: COMPLETE_AFTER_DETERMINISTIC_NORMALIZATION
    RELATIVE_SMALL:
      description_zh: “一点”“稍微”“一点点”等统一表示相对小幅，只保存语言语义，不绑定固定物理步长。
      examples:
      - 一点
      - 稍微
      - 一点点
      resolution_status: INCOMPLETE_NEEDS_VEHICLE_PARAMETERIZATION
      prohibited_fixed_conversions:
      - 5%
      - 10%
      - FIXED_MILLIMETERS
      - FIXED_DEGREES
    PARTIAL_UNSPECIFIED:
      description_zh: 用户表达了“一部分”等部分调节，但目标程度不足；不得自动解释为一半或 50%。
      examples:
      - 开一部分
      - 调一部分
      resolution_status: INCOMPLETE_NEEDS_CLARIFICATION
      prohibited_normalization: 50%
  deterministic_lexical_normalization:
    HALF_FOR_PERCENT_CONTRACT:
      source_semantics: 一半
      canonical_value: 50
      canonical_unit: '%'
      applies_only_to_percent_contracts: true
  parameter_completeness_rules:
    DIRECTION_WITHOUT_VALUE_FOR_NUMERIC_CONTROL:
      intent_recognition_allowed: true
      parameter_resolution_status: INCOMPLETE_MISSING_MAGNITUDE
      default_physical_step_prohibited: true
      future_behavior: VEHICLE_PARAMETERIZATION_OR_REVIEW
    RELATIVE_SMALL_WITHOUT_VEHICLE_STEP:
      intent_recognition_allowed: true
      parameter_resolution_status: INCOMPLETE_NEEDS_VEHICLE_PARAMETERIZATION
      default_physical_step_prohibited: true
    PARTIAL_UNSPECIFIED_DEGREE:
      intent_recognition_allowed: true
      parameter_resolution_status: INCOMPLETE_NEEDS_CLARIFICATION
      automatic_half_normalization_prohibited: true
