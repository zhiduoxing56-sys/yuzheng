    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-019
    source_semantic_pattern: 功能/对象明确为蓝牙/热点/WIFI且操作属于 ON/OFF
    target_semantics: KNOWN::CONNECTIVITY::STATE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [播放蓝牙音乐, 仅打开设置页面]
    reason_added: 连接开关语义明确且属于座舱认知能力
    corresponding_sample_count: 60
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-020
    source_semantic_pattern: 功能/对象明确为无线充电且操作属于 ON/OFF
    target_semantics: KNOWN::WIRELESS_CHARGING::STATE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [充电站信息查询]
    reason_added: 无线充电开关是明确座舱控制
    corresponding_sample_count: 13
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-021
    source_semantic_pattern: 调节内容=模式且模式属于明确车辆驾驶/能源/驻车舒享模式白名单
    target_semantics: KNOWN::VEHICLE_MODE::MODE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [HVAC模式, 影音模式, 设置页面, 无模式枚举]
    reason_added: 结构化枚举可证明车辆模式，但不属于七十一项正式执行范围
    corresponding_sample_count: 167
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-022
    source_semantic_pattern: 功能/对象功能明确为低速提示音/低速报警且操作属于 ON/OFF
    target_semantics: KNOWN::EXTERIOR_ALERT_SOUND::STATE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [普通媒体音量]
    reason_added: 低速外部提示声是明确车辆能力
    corresponding_sample_count: 40
    human_audit_status: 待人工签署

  - rule_id: V3-FORMAL-001
    source_semantic_pattern: 对象=后视镜/外后视镜，对象功能=加热，操作属于 ON/OFF
    target_semantics: MIRROR_HEATING_ON_OR_OFF
    applies_to: MAC-SLU 结构化 frame
    exclusions: [后视镜角度或折叠]
    reason_added: 修复多意图整句污染导致的镜面加热漏映射
    corresponding_sample_count: 37
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-002
    source_semantic_pattern: 对象=座椅/坐垫且调节内容明确为整体倾角
    target_semantics: SEAT_TILT_SET_ANGLE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [仅高度、靠背角度或前后位置]
    reason_added: 区分座椅整体倾角与高度/靠背
    corresponding_sample_count: 2
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-003
    source_semantic_pattern: 对象=后视镜/外后视镜且调节内容=方向/角度
    target_semantics: MIRROR_SET_ANGLE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [折叠, 加热, 调节锁]
    reason_added: MAC 用方向字段表达镜面角度
    corresponding_sample_count: 4
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-004
    source_semantic_pattern: 对象=天窗且操作=翘起/后翘/下收
    target_semantics: SUNROOF_SET_TILT
    applies_to: MAC-SLU 结构化 frame
    exclusions: [普通打开/关闭, 透光度]
    reason_added: 恢复天窗 tilt 方向动作
    corresponding_sample_count: 3
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-005
    source_semantic_pattern: 功能属于巡航词表且调节内容=速度
    target_semantics: CRUISE_SET_SPEED
    applies_to: MAC-SLU 结构化 frame
    exclusions: [限速器而非巡航, value 缺失或仅相对方向无法满足速度合同]
    reason_added: MAC 巡航语义主要位于功能而非对象字段
    corresponding_sample_count: 6
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-006
    source_semantic_pattern: 功能属于巡航词表且调节内容=距离/跟车距离
    target_semantics: CRUISE_SET_GAP
    applies_to: MAC-SLU 结构化 frame
    exclusions: [非巡航驾驶辅助距离, value/mode 无法规范化]
    reason_added: 恢复巡航跟车距离功能字段
    corresponding_sample_count: 4
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-007
    source_semantic_pattern: 对象或车外灯类型=转向灯且操作属于 ON/OFF
    target_semantics: TURN_INDICATOR_ON_OR_OFF
    applies_to: MAC-SLU 结构化 frame
    exclusions: [预览/设置页面, ON 缺 LEFT/RIGHT]
    reason_added: 恢复明确方向的转向灯开启样本，缺方向继续缺槽
    corresponding_sample_count: 7
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-008
    source_semantic_pattern: 对象=雨刮/雨刮器且调节内容=灵敏度
    target_semantics: WIPER_SET_SENSITIVITY
    applies_to: MAC-SLU 结构化 frame
    exclusions: [value 无法规范化, 实际表达雨刮速度模式]
    reason_added: 恢复雨刮灵敏度结构字段
    corresponding_sample_count: 2
    human_audit_status: 待人工签署
  - rule_id: V3-FORMAL-009
    source_semantic_pattern: 模式=自动驻车/自动驻车制动且操作属于 ON/OFF
    target_semantics: PARKING_BRAKE_AUTO_APPLY_ENABLE_OR_DISABLE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [自动泊车, 普通驻车制动施加/释放]
    reason_added: 区分自动驻车制动策略与自动泊车
    corresponding_sample_count: 7
    human_audit_status: 待人工签署

  - rule_id: V3-NOFRAME-001
    source_semantic_pattern: 无 usable frame，文本同时含具体正式对象与明确动作
    target_semantics: R3 formal intent via exact object-action contract
    applies_to: MAC-SLU 无 frame 样本
    exclusions: [宽泛灯光, 指代对象, 缺必需槽, 多候选对象]
    reason_added: 只恢复高精度显式车控文本
    corresponding_sample_count: 13
    human_audit_status: 待人工签署
  - rule_id: V3-NOFRAME-002
    source_semantic_pattern: 无 usable frame，文本同时含普通座舱具体对象与明确动作
    target_semantics: KNOWN_UNSUPPORTED_CONTROL
    applies_to: MAC-SLU 无 frame 样本
    exclusions: [只有对象名, 设置页面导航, 动作不明确]
    reason_added: 无 frame 不等于非车辆控制
    corresponding_sample_count: 63
    human_audit_status: 待人工签署
  - rule_id: V3-NOFRAME-003
    source_semantic_pattern: 无 usable frame，文本含明确非控制域标记且不含任何具体控制对象动作对
    target_semantics: NON_CONTROL
    applies_to: MAC-SLU 无 frame 样本
    exclusions: [控制与非控制混合, 具体车辆控制证据]
    reason_added: 对明确音乐/地图/天气/电话/影视/信息查询解除不必要 review
    corresponding_sample_count: 1407
    human_audit_status: 待人工签署
  - rule_id: V3-NOFRAME-004
    source_semantic_pattern: 无 usable frame，空白、极短指代或明显截断垃圾输入
    target_semantics: UNKNOWN_REVIEW_GARBAGE
    applies_to: MAC-SLU 无 frame 样本
    exclusions: [存在具体对象动作对]
    reason_added: 将残缺垃圾与真正无法判断分开审计，不降低安全门
    corresponding_sample_count: 28
    human_audit_status: 待人工签署
  - rule_id: V3-NONCONTROL-001
    source_semantic_pattern: 车载控制 frame 的调节内容明确为媒体音量/声音，或功能明确为电量/续航/胎压等信息查询
    target_semantics: NON_CONTROL
    applies_to: MAC-SLU 结构化 frame
    exclusions: [同一 frame 存在明确车辆物理控制对象]
    reason_added: 媒体控制和信息查询不产生车辆执行动作，不应长期保留为未知
    corresponding_sample_count: 573
    human_audit_status: 待人工签署
