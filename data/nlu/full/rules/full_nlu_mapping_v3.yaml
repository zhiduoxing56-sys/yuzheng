mapping_rule_version: nlu_mapping_v3
target_registry_version: sys-014-semantic-hardening-r3
target_registry_sha256: c3c5338af148d24aa58b702e579abf615af1dffc3c1568c09ed2fcdc88164e06
status: FROZEN_FOR_BASELINE_V2_BUILD
scope: DETERMINISTIC_MAC_SEMANTIC_COVERAGE_ONLY
parent_mapping_rule:
  path: data/nlu/full/rules/full_nlu_mapping_v2.yaml
  version: nlu_mapping_v2
  sha256: cf2eed72aa829083e0b666777799ab8052f674bb49b10637340d54882a142aa4
immutable_inputs:
  registry: data/nlu/spec/intent_registry_r3.yaml
  schema: data/nlu/full/schema/full_nlu_sample_schema_v1.json
prohibitions:
  nearest_neighbor_intent_selection: true
  broad_light_resolution: true
  missing_slot_invention: true
  multi_intent_collapse: true
  ordinary_cabin_to_formal_scope: true

operation_classes:
  'ON': [打开, 开启, 启用, 启动, 使用, 开, 开开]
  'OFF': [关闭, 关掉, 关上, 关了, 关, 停用, 禁用, 停止]
  ADJUST: [调, 调节, 调整, 设置, 调为, 调到, 增大, 减小, 提高, 降低, 切换, 选择, 移, 移动, 滑, 滑动]
  OPEN: [打开, 开启, 开, 降下, 摇下]
  CLOSE: [关闭, 关掉, 关上, 升起]

rules:
  - rule_id: V3-FRAME-001
    source_semantic_pattern: 当前 MAC 子意图 frame 内结构字段可独立组成 v2 可解析语义
    target_semantics: 仅使用当前 frame 调用冻结 v2 确定性映射
    applies_to: MAC-SLU 车载控制 frame
    exclusions: [空 frame, 宽泛车灯或灯光, 当前 frame 无动作且无唯一合同]
    reason_added: 修复整句其他子意图污染当前 frame 的对象和动作选择
    corresponding_sample_count: 1961
    human_audit_status: 待人工签署

  - rule_id: V3-CABIN-001
    source_semantic_pattern: 对象或车内灯类型=阅读灯，操作属于 ON/OFF
    target_semantics: KNOWN::READING_LIGHT::STATE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [无明确 ON/OFF 操作]
    reason_added: 阅读灯是明确座舱控制但不在七十一项正式执行范围
    corresponding_sample_count: 39
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-002
    source_semantic_pattern: 对象或车内灯类型=车内灯/舱内灯/顶灯，操作属于 ON/OFF
    target_semantics: KNOWN::CABIN_LIGHT::STATE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [阅读灯, 氛围灯, 宽泛灯/灯光]
    reason_added: 恢复普通车内灯认知层
    corresponding_sample_count: 14
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-003
    source_semantic_pattern: 对象=空调且操作属于 ON/OFF
    target_semantics: KNOWN::HVAC::STATE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [只有设置页面导航而无控制动作]
    reason_added: 空调启停可由对象和操作唯一确定
    corresponding_sample_count: 943
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-004
    source_semantic_pattern: 调节内容=温度，操作属于 ADJUST
    target_semantics: KNOWN::HVAC::TEMPERATURE
    applies_to: MAC-SLU 车载控制 frame
    exclusions: [座椅加热温度, 非车辆天气温度查询, 无调节动作]
    reason_added: MAC 常省略空调对象但温度字段已唯一表达座舱温控
    corresponding_sample_count: 638
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-005
    source_semantic_pattern: 调节内容=风量/风速/风力/风，操作属于 ADJUST
    target_semantics: KNOWN::HVAC::FAN_SPEED
    applies_to: MAC-SLU 车载控制 frame
    exclusions: [座椅通风等级, 无调节动作]
    reason_added: 风量字段可唯一证明 HVAC 风机控制
    corresponding_sample_count: 558
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-006
    source_semantic_pattern: 调节内容=风向且操作属于 ADJUST/ON/OFF
    target_semantics: KNOWN::HVAC::AIR_DIRECTION
    applies_to: MAC-SLU 车载控制 frame
    exclusions: [座椅或屏幕方向, 无 HVAC 风向语义]
    reason_added: 恢复吹脸/吹脚/吹窗等明确风向控制
    corresponding_sample_count: 165
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-007
    source_semantic_pattern: 调节内容=模式且模式属于 HVAC 模式词表
    target_semantics: KNOWN::HVAC::MODE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [驾驶模式, 驻车舒享, 影音模式, 设置页面]
    reason_added: 仅恢复 AC/内外循环/制冷/制热等明确 HVAC 模式
    corresponding_sample_count: 303
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-008
    source_semantic_pattern: 对象=座椅且对象功能=加热
    target_semantics: KNOWN::SEAT_HEATING::STATE_OR_LEVEL
    applies_to: MAC-SLU 结构化 frame
    exclusions: [只有座椅温度且不能证明加热]
    reason_added: 座椅加热是明确座舱控制
    corresponding_sample_count: 183
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-009
    source_semantic_pattern: 对象=座椅且对象功能=通风
    target_semantics: KNOWN::SEAT_VENTILATION::STATE_OR_LEVEL
    applies_to: MAC-SLU 结构化 frame
    exclusions: [普通车窗通风, 仅出现通风但无座椅证据]
    reason_added: 座椅通风是明确座舱控制
    corresponding_sample_count: 551
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-010
    source_semantic_pattern: 对象=座椅或对象功能=按摩且操作明确
    target_semantics: KNOWN::SEAT_MASSAGE::STATE_OR_LEVEL
    applies_to: MAC-SLU 结构化 frame
    exclusions: [无动作的按摩设置页面]
    reason_added: 座椅按摩是明确座舱控制
    corresponding_sample_count: 407
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-011
    source_semantic_pattern: 对象或车内灯类型=氛围灯且操作明确
    target_semantics: KNOWN::AMBIENT_LIGHT::STATE_OR_ATTRIBUTE
    applies_to: MAC-SLU 结构化 frame
    exclusions: [宽泛灯光]
    reason_added: 氛围灯是明确座舱控制
    corresponding_sample_count: 126
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-012
    source_semantic_pattern: 对象=遮阳帘/遮阳幕且操作明确
    target_semantics: KNOWN::SUNSHADE::OPENING
    applies_to: MAC-SLU 结构化 frame
    exclusions: [天窗本体]
    reason_added: 遮阳帘是明确座舱控制
    corresponding_sample_count: 178
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-013
