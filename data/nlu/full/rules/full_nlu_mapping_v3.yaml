    corresponding_sample_count: 180
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-014
    source_semantic_pattern: 对象=香氛/香薰/芳香且操作明确
    target_semantics: KNOWN::FRAGRANCE::STATE_OR_LEVEL
    applies_to: MAC-SLU 结构化 frame
    exclusions: [无控制动作]
    reason_added: 香氛是明确座舱控制
    corresponding_sample_count: 61
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-015
    source_semantic_pattern: 对象=方向盘且对象功能=加热
    target_semantics: KNOWN::STEERING_WHEEL_HEATING::STATE_OR_LEVEL
    applies_to: MAC-SLU 结构化 frame
    exclusions: [方向盘位置调节]
    reason_added: 方向盘加热是明确座舱控制
    corresponding_sample_count: 52
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-016
    source_semantic_pattern: 对象=天窗/天幕且调节内容=透光度/透明度
    target_semantics: KNOWN::ROOF_GLASS::TRANSPARENCY
    applies_to: MAC-SLU 结构化 frame
    exclusions: [天窗打开/关闭/翘起]
    reason_added: 透光度是明确座舱玻璃属性，但不是 R3 天窗开闭合同
    corresponding_sample_count: 46
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-017
    source_semantic_pattern: 对象=屏幕/娱乐屏且调节内容=方向并有移动动作
    target_semantics: KNOWN::DISPLAY::POSITION
    applies_to: MAC-SLU 结构化 frame
    exclusions: [屏幕页面导航, 无方向语义]
    reason_added: 屏幕物理移动是明确座舱控制
    corresponding_sample_count: 158
    human_audit_status: 待人工签署
  - rule_id: V3-CABIN-018
    source_semantic_pattern: 对象=扶手/扶手台且调节内容=方向并有移动动作
    target_semantics: KNOWN::ARMREST::POSITION
    applies_to: MAC-SLU 结构化 frame
    exclusions: [无移动动作]
    reason_added: 扶手位置是明确座舱控制
