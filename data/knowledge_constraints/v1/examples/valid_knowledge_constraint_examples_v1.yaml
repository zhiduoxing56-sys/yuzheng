# 合法知识约束节点示例（valid-knowledge-constraint-examples-v1）
# 对齐队友 knowledge_constraint_contract_v1.yaml
# 结构：source 为 string；chapter/clause 独立字段；when 只含 all 或 any 之一

# ---------- 1. 夜间行驶关闭前照灯（数字比较 GT/LT + BLOCK） ----------
- node_id: 知识.灯光.夜间关闭限制.001
  node_type: 安全知识
  title: 行驶且低照度时禁止关闭前照灯
  source: GB 7258-2017
  chapter: 第8章
  clause: 8.2.1
  command:
    intent_id: HEADLIGHT_SET_MODE
    action: SWITCH_MODE
    target: HEADLIGHT
    area: ANY
    mode: OFF
  evidence:
    speed:
      type: VEHICLE_SPEED
      field: value
    light:
      type: ENVIRONMENT_CONDITIONS
      field: ambient_illumination
  when:
    all:
      - field: speed
        op: GT
        value: 0
      - field: light
        op: LT
        value: 20
  effect:
    then: BLOCK
    else: ALLOW
    reason_code: LOW_LIGHT_HEADLIGHT_OFF_PROHIBITED
    reason: 行驶且环境照度低于20 lux时禁止关闭前照灯

# ---------- 2. 雨天关闭雨刷（枚举 IN + BLOCK） ----------
- node_id: 知识.雨刮.雨天关闭限制.001
  node_type: 安全知识
  title: 雨天行驶中禁止关闭雨刷
  source: 道路交通安全法
  chapter: 第二十二条
  clause: 22
  command:
    intent_id: WIPER_SET_MODE
    action: SWITCH_MODE
    target: WIPER
    area: ANY
    mode: OFF
  evidence:
    weather:
      type: ENVIRONMENT_CONDITIONS
      field: weather
    speed:
      type: VEHICLE_SPEED
      field: value
  when:
    all:
      - field: speed
        op: GT
        value: 0
      - field: weather
        op: IN
        value: [RAIN, HEAVY_RAIN]
  effect:
    then: BLOCK
    else: ALLOW
    reason_code: RAIN_WIPER_OFF_PROHIBITED
    reason: 雨天行驶中禁止关闭雨刷

# ---------- 3. 行驶中打开车门（数字比较 + BLOCK） ----------
- node_id: 知识.车门.行驶开门限制.001
  node_type: 安全知识
