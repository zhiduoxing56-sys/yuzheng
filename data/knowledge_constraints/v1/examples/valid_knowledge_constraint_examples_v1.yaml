# ---------- 4. 未授权解锁车门（布尔 EQ + BLOCK） ----------
- node_id: 知识.车门.未授权解锁限制.001
  node_type: 安全知识
  title: 未授权时禁止解锁车门
  source: GB 7258-2017
  chapter: 第11章
  clause: 11.5.10
  command:
    intent_id: DOOR_LOCK
    action: UNLOCK
    target: DOOR
    area: ANY
  evidence:
    auth:
      type: AUTHORIZATION_STATE
      field: authorized
  when:
    all:
      - field: auth
        op: EQ
        value: false
  effect:
    then: BLOCK
    else: ALLOW
    reason_code: UNAUTHORIZED_DOOR_UNLOCK_BLOCKED
    reason: 未授权时禁止解锁车门

# ---------- 5. 倒车时关闭显示屏（REVIEW 示例） ----------
- node_id: 知识.显示.倒车屏幕关闭.001
  node_type: 安全知识
  title: 倒车时关闭显示屏需复核
  source: 工程安全规则
  chapter: 倒车安全
  clause: REV-01
  command:
    intent_id: DISPLAY_SET_POWER
    action: TURN_OFF
    target: DISPLAY
    area: ANY
  evidence:
    gear:
      type: GEAR_STATE
      field: current_gear
    cam:
      type: REVERSE_CAMERA_STATE
      field: active
  when:
    all:
      - field: gear
        op: EQ
        value: REVERSE
      - field: cam
        op: EQ
        value: true
  effect:
    then: REVIEW
    else: ALLOW
    reason_code: REVERSE_DISPLAY_OFF_REVIEW
    reason: 倒车时关闭显示屏需复核

# ---------- 6. 前方近距离障碍时加速（any 示例 + BLOCK） ----------
- node_id: 知识.加速.近距障碍加速限制.001
  node_type: 安全知识
  title: 前方近距离障碍时禁止加速
  source: 道路交通安全法
  chapter: 第四十三条
  clause: 43
  command:
    intent_id: ACCELERATE
    action: INCREASE
    target: VEHICLE_SPEED
    area: ANY
  evidence:
    dist:
      type: SURROUNDING_OBJECT_STATE
      field: front_distance
    ttc:
      type: SURROUNDING_OBJECT_STATE
      field: ttc_front
  when:
    any:
      - field: dist
        op: LT
        value: 10
      - field: ttc
        op: LT
        value: 2.0
  effect:
    then: BLOCK
    else: ALLOW
    reason_code: CLOSE_OBSTACLE_ACCELERATE_BLOCKED
    reason: 前方近距离障碍时禁止加速
