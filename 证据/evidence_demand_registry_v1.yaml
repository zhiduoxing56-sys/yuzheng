      ENVIRONMENT_CONDITIONS: 照度、雨雾等环境条件会影响驾驶视野相关动作风险。
  CRUISE_ENABLE:
    mandatory:
    - VEHICLE_SPEED
    - GEAR_STATE
    - CRUISE_STATE
    recommended:
    - SURROUNDING_OBJECT_STATE
    - LANE_STATE
    - ENVIRONMENT_CONDITIONS
    conditional_mandatory: []
    rationale:
      VEHICLE_SPEED: 车辆运动状态是多类车控动作的关键执行前提。
      GEAR_STATE: 挡位用于判断驻车/行驶状态以及动力传递条件。
      CRUISE_STATE: 确认巡航当前启用、工作及设定状态。
      SURROUNDING_OBJECT_STATE: 周边车辆、行人和障碍物的位置/相对运动会改变动作安全性。
      LANE_STATE: 当前与相邻车道状态直接影响车道控制动作。
      ENVIRONMENT_CONDITIONS: 照度、雨雾等环境条件会影响驾驶视野相关动作风险。
  CRUISE_DISABLE:
    mandatory: []
    recommended:
